<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>SUPER HERO RUN</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  html, body { height: 100dvh; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: auto; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 10; width: 100vw; height: auto; }
  @media (min-aspect-ratio: 16/10) { canvas { width: auto; height: 100vh; height: 100dvh; } }
  #touch { position: fixed; inset: auto 0 max(12px, env(safe-area-inset-bottom)) 0; display: none; justify-content: space-between; padding: 0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right)); pointer-events: none; }
  #touch div { display: flex; gap: 8px; }
  #touch button { pointer-events: auto; width: 60px; height: 60px; -webkit-tap-highlight-color: transparent; border-radius: 50%; border: 2px solid #fff6; background: #0004; color: #fffc; font-size: 24px; touch-action: none; user-select: none; }
  #touch button:active { background: #fff4; }
  @media (pointer: coarse) { #touch { display: flex; } }
  #rotate { display: none; position: fixed; inset: 0; background: #111; color: #fff; font: 900 22px sans-serif; align-items: center; justify-content: center; text-align: center; z-index: 10; }
  @media (pointer: coarse) and (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="rotate">📱↻<br>スマホを横向きにして<br>遊んでね</div>
<canvas id="game" width="960" height="600"></canvas>
<div id="touch">
  <div><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div>
  <div><button data-k="KeyX">B</button><button data-k="KeyC">P</button><button data-k="Space">A</button></div>
</div>
<script src="sprites.js"></script>
<script src="poses.js"></script>
<script src="assets.js"></script>
<script src="game.js"></script>
</body>
</html>
